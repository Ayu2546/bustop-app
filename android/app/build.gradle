buildscript {
    ext.kotlin_version = "1.9.0" 
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id "dev.flutter.flutter-gradle-plugin"
}

// Keep developer-specific API keys outside version control.
def mapsProperties = new Properties()
def mapsPropertiesFile = rootProject.file("maps.properties")
if (mapsPropertiesFile.exists()) {
    mapsPropertiesFile.withInputStream { mapsProperties.load(it) }
}
def mapsApiKey = mapsProperties.getProperty("GOOGLE_MAPS_API_KEY", "").trim()
if (!mapsApiKey || mapsApiKey == "YOUR_ANDROID_MAPS_API_KEY") {
    throw new GradleException("Set GOOGLE_MAPS_API_KEY in android/maps.properties. See README.md.")
}

android {
    namespace = "com.example.BuStop"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = mapsApiKey
        applicationId = "com.example.BuStop"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}